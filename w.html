  <script>
    (() => {
      const splash = document.getElementById('splash');
      if (!splash) return;
      const hash = window.location.hash || '';
      if (['#/avatar', '#/widget-', '#/diagnostic', '#/lipsync-debug'].some((prefix) => hash.startsWith(prefix))) {
        splash.remove();
        return;
      }
      const nowFn = () => (window.performance && typeof performance.now === 'function' ? performance.now() : Date.now());
      // Let the orbital intro (ring draw + comet launch) complete before exiting.
      const MIN_DISPLAY_MS = 1200;
      const FADE_MS = 500;
      let dismissed = false;
      let done = false;
      window.__eidolonSplash = {
        shownAt: nowFn(),
        dismiss() {
          if (dismissed || done) return;
          dismissed = true;
          const wait = Math.max(0, MIN_DISPLAY_MS - (nowFn() - window.__eidolonSplash.shownAt));
          window.setTimeout(() => {
            if (done) return;
            done = true;
            splash.classList.add('splash-hide');
            window.setTimeout(() => splash.remove(), FADE_MS + 80);
          }, wait);
        },
        fail() {
          dismissed = true;
          done = true;
          splash.remove();
        },
      };
      const stuckEl = splash.querySelector('.splash-stuck');
      const reloadBtn = splash.querySelector('.splash-stuck-reload');
      if (reloadBtn) reloadBtn.addEventListener('click', () => window.location.reload());
      window.setTimeout(() => {
        if (!dismissed && !done && stuckEl) stuckEl.hidden = false;
      }, 20000);
    })();
  </script>
